# config.ini
# MultiVerse Backend — Runtime Configuration
# Edit these values to match your machine. Do not hardcode them in Python files.

[database]
db_path = data/NKJV.SQLite3
translation = NKJV

[transcription]
; base.en is the correct model — already confirmed working on this machine.
; medium.en is too slow for live use on this CPU (15-25s per chunk).
; tiny.en is not present in the cache — do not use.
model_size = base.en
device = cpu
compute_type = int8
; Your actual HuggingFace cache path on this Windows machine:
model_dir = C:\Users\Strenght Awa\.cache\huggingface\hub
local_files_only = true

[audio]
sample_rate = 16000
; chunk_seconds: how many seconds of audio Whisper processes at once.
; 3 seconds is the minimum for reliable speech recognition.
chunk_seconds = 3
channels = 1
; overlap_seconds: how far the PREVIOUS chunk bleeds into the CURRENT chunk.
; This is the sliding window fix. With chunk=3 and overlap=1.5, every 1.5
; seconds a new 3-second window is processed. A paraphrase spoken across a
; chunk boundary will be fully captured in at least one of the two windows.
; Set to 0 to disable sliding window (sequential chunks only).
overlap_seconds = 1.5
; 0 = default input device. Change if your audio interface is on a different index.
input_device_index = 0

[detection]
; Rapidfuzz threshold for book name fuzzy matching (0.0–1.0)
regex_threshold = 0.75
; FAISS cosine similarity threshold for paraphrase matching (0.0–1.0)
vector_threshold = 0.72
; After a verse triggers, suppress the same verse for this many seconds.
; Prevents the same verse firing 3 times because the sliding window overlaps.
cooldown_seconds = 8

[vectors]
index_path = data/bible_vectors.index
verse_map_path = data/bible_verse_map.pkl
; This model is already present in your cache — no download needed.
embedding_model = all-MiniLM-L6-v2

[logging]
log_dir = logs
log_level = INFO
; 5MB per file, 3 backups
max_bytes = 5242880
backup_count = 3
