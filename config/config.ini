[audio]
sample_rate = 16000
chunk_seconds = 3
overlap_seconds = 0.0
max_queue_size = 1
channels = 1
input_device_index = auto
vad_rms_threshold = 0.0005

[transcription]
model_size = tiny.en
beam_size = 1
temperature = 0
condition_on_previous_text = false
fp16 = false
local_files_only = true
initial_prompt = Romans 8:1. John 3:16. Genesis 1:1. John 4:24. In spirit and in truth. God created man in his image. No condemnation in Christ Jesus.

[detection]
vector_threshold = 0.70
regex_threshold = 0.75
book_memory_seconds = 20
# Minimum words a transcript chunk needs before semantic (paraphrase)
# search even runs -- short filler speech produces noisy embeddings that
# can land a high-confidence false match purely by chance.
min_semantic_words = 8
# Hard gate (0-1): a candidate verse is rejected outright if the ratio of
# (words shared with the transcript) / (words in the transcript) falls
# below this, no matter how high its cosine similarity is. Previously
# overlap only added a small bonus on top of similarity and could never
# reject a match by itself -- this is what actually stops a stray
# covenant-adjacent word in casual talk from matching a real verse.
min_overlap_ratio = 0.25
# Suppress the exact same (book, chapter, verse) firing again within this
# many seconds -- fixes the double-print where two adjacent chunks each
# independently re-trigger the same real-world moment.
dedup_seconds = 6
# Per-source minimum gap (seconds) between auto-displaying two DIFFERENT
# verses back-to-back, so the on-screen text doesn't flicker between
# candidates. Replaces the old hardcoded AUTO_DISPLAY_COOLDOWN dict.
cooldown_regex_seconds = 1.5
cooldown_semantic_seconds = 4.0
cooldown_narrative_seconds = 5.0

[app]
# Seconds of silence before the UI shows "idle, paused" state.
idle_timeout_seconds = 600

[library]
# Root folder scanned for Bible versions. Layout: data_root/<Version>/<Language>/*.sqlite3
# (a version folder with no language subfolder is treated as English-only).
# Drop a new file in the right folder and it's picked up automatically --
# no code change or restart-with-different-args needed.
data_root = data
show_secondary_translation_by_default = false
# When a second language exists, show it above (true) or below (false) the primary.
secondary_above_primary_by_default = false
# 0 disables periodic re-scanning (a scan still runs whenever a UI tab connects).
rescan_interval_seconds = 30

[ndi]
# Broadcasts the current verse as an NDI video source that vMix (or any
# NDI receiver) can add as a normal input. See NDI_SETUP.md.
enabled = true
sender_name = MultiVerse
width = 1920
height = 1080
# NDI expects a live stream, not a single static push -- this is how
# often the (unchanged) current frame is re-sent so receivers don't show
# it as frozen/stale. 2-5 is plenty for text that only changes on a verse
# trigger.
fps = 3
# Leave blank to use a bundled default font; set to an absolute .ttf path
# to use your own.
font_path =
font_size = 56
reference_font_size = 44
secondary_font_size = 46
text_color = 245,242,234
reference_color = 201,168,106
secondary_color = 148,151,163
separator_color = 35,36,41
background_color = 0,0,0
# 0 = fully transparent (for chroma-key/alpha-aware receivers), 255 = opaque.
background_alpha = 255
# Matches the Live Output stage (.stage-text max-width: 90%).
content_width_ratio = 0.90
margin = 80

[database]
# The active Bible DB. Schema (table/column names) is auto-detected from
# this file on startup — see bible_schema.py / inspect_bible_db.py.
# 'translation' is just a label attached to lookup results; it does not
# affect how the file is read.
db_path = data/NKJV.SQLite3
translation = NKJV

# Optional: list additional Bible DB files here for reference/quick-switching.
# Not read automatically by server.py yet — this is bookkeeping so you don't
# lose track of what's available. To switch, change db_path above and run
# inspect_bible_db.py on it first.
[translations]
; NKJV = data/NKJV.SQLite3
; KJV = data/KJV.SQLite3
; ESV = data/ESV.SQLite3

[vectors]
index_path = data/bible_vectors.index
verse_map_path = data/bible_verse_map.pkl
embedding_model = all-MiniLM-L6-v2

[logging]
log_dir = logs
log_level = INFO
log_file = logs/multiverse.log

[output]
transcript_tail_words = 8
