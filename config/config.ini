[audio]
sample_rate = 16000
chunk_seconds = 3
overlap_seconds = 0.0
max_queue_size = 1
channels = 1
input_device_index = auto
vad_rms_threshold = 0.0005

[transcription]
model_size = tiny.en
beam_size = 1
temperature = 0
condition_on_previous_text = false
fp16 = false
local_files_only = true
initial_prompt = Romans 8:1. John 3:16. Genesis 1:1. John 4:24. In spirit and in truth. God created man in his image. No condemnation in Christ Jesus.

[detection]
vector_threshold = 0.70
regex_threshold = 0.75
cooldown_seconds = 8
book_memory_seconds = 10

[database]
# The active Bible DB. Schema (table/column names) is auto-detected from
# this file on startup — see bible_schema.py / inspect_bible_db.py.
# 'translation' is just a label attached to lookup results; it does not
# affect how the file is read.
db_path = data/NKJV.SQLite3
translation = NKJV

# Optional: list additional Bible DB files here for reference/quick-switching.
# Not read automatically by server.py yet — this is bookkeeping so you don't
# lose track of what's available. To switch, change db_path above and run
# inspect_bible_db.py on it first.
[translations]
; NKJV = data/NKJV.SQLite3
; KJV = data/KJV.SQLite3
; ESV = data/ESV.SQLite3

[vectors]
index_path = data/bible_vectors.index
verse_map_path = data/bible_verse_map.pkl
embedding_model = all-MiniLM-L6-v2

[logging]
log_dir = logs
log_level = INFO
log_file = logs/multiverse.log

[output]
transcript_tail_words = 8
